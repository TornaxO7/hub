name: crowdsecurity/crs-exclusion-plugin-nextcloud

# This appsec-rule is only here to make crowdsec download the datafiles, inclusion is done by the CRS appsec-rules

data:
  - source_url: http://127.0.0.1/appsec/crs-plugins/nextcloud-rule-exclusions-plugin/nextcloud-rule-exclusions-before.conf
    dest_file: crs-plugins/nextcloud/nextcloud-rule-exclusions-before.conf
    type: modsec
  - source_url: http://127.0.0.1/appsec/crs-plugins/nextcloud-rule-exclusions-plugin/nextcloud-rule-exclusions-config.conf
    dest_file: crs-plugins/nextcloud/nextcloud-rule-exclusions-config.conf
    type: modsec